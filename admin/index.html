<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Echo Arena Admin</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand">ECHO <span>ADMIN</span></div>
      <nav>
        <a class="active" href="./index.html">Dashboard</a>
        <a href="./heroes.html">Heróis</a>
        <a href="../index.html">Ver site</a>
      </nav>
      <button id="logout" class="btn ghost">Sair</button>
    </aside>

    <main class="content">
      <div class="page-head">
        <div>
          <span class="eyebrow">Visão geral</span>
          <h1>Dashboard</h1>
        </div>
        <a class="btn primary" href="./hero-editor.html">Novo herói</a>
      </div>

      <section class="stats-grid">
        <article class="stat-card"><span>Heróis</span><strong id="heroes-count">—</strong></article>
        <article class="stat-card"><span>Equipamentos</span><strong id="equipments-count">—</strong></article>
        <article class="stat-card"><span>Builds</span><strong id="builds-count">—</strong></article>
        <article class="stat-card"><span>Usuários</span><strong id="users-count">—</strong></article>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireAdmin, logoutAdmin } from './js/admin-auth.js';
    import { countRows } from './js/api.js';

    await requireAdmin();

    document.getElementById('logout').onclick = logoutAdmin;

    const counts = await Promise.all([
      countRows('heroes'),
      countRows('equipments'),
      countRows('builds'),
      countRows('profiles')
    ]);

    document.getElementById('heroes-count').textContent = counts[0];
    document.getElementById('equipments-count').textContent = counts[1];
    document.getElementById('builds-count').textContent = counts[2];
    document.getElementById('users-count').textContent = counts[3];
  </script>
</body>
</html>
