<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Echo Arena Admin — Login</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">ECHO <span>ARENA</span></div>
    <h1>Painel administrativo</h1>
    <p>Entre com sua conta de administrador.</p>

    <form id="login-form">
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Senha
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn primary">Entrar</button>
      <div id="message" class="message"></div>
    </form>
  </main>

  <script type="module">
    import { loginAdmin, redirectIfAdmin } from './js/admin-auth.js';

    await redirectIfAdmin('./index.html');

    const form = document.getElementById('login-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Entrando...';
      message.className = 'message';

      try {
        await loginAdmin(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        location.href = './index.html';
      } catch (error) {
        message.textContent = error.message;
        message.className = 'message error';
      }
    });
  </script>
</body>
</html>
