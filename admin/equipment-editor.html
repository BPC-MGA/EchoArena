<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de equipamento — Echo Admin</title>
<link rel="stylesheet" href="./css/admin.css">
<link rel="stylesheet" href="./css/equipments.css">
</head>
<body>
<div class="equipment-page">
  <aside class="sidebar">
    <div class="brand">ECHO <span>ADMIN</span></div>
    <nav><a href="./index.html">Dashboard</a><a href="./heroes.html">Heróis</a><a class="active" href="./equipments.html">Equipamentos</a></nav>
    <button id="logout" class="btn ghost">Sair</button>
  </aside>
  <main class="equipment-main">
    <header class="eq-head">
      <div><div class="eyebrow">Cadastro</div><h1 id="page-title">Novo equipamento</h1></div>
      <a class="eq-btn" href="./equipments.html">Voltar</a>
    </header>

    <form id="form">
      <section class="eq-panel">
        <div class="eq-grid">
          <label>Nome<input id="name" required></label>
          <label>Slug<input id="slug" required></label>
          <label>Slot<select id="slot-id"><option value="">Sem slot</option></select></label>
          <label>Ordem<input id="display-order" type="number" value="0"></label>
          <label>Conjunto<select id="set-id"><option value="">Sem conjunto</option></select></label>
          <label>Novo conjunto<input id="new-set-name" placeholder="Opcional"></label>
          <label class="full">Descrição<textarea id="description" rows="4"></textarea></label>
          <label class="full">Indicação / recomendação<textarea id="recommendation" rows="4"></textarea></label>
          <label>Imagem do item<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
          <label><input id="enabled" type="checkbox" checked style="width:auto"> Ativo</label>
        </div>
        <div class="preview-large" id="preview-image" style="margin-top:14px">Prévia da imagem</div>
      </section>

      <section class="eq-panel">
        <h2>Raridades e atributos</h2>
        <div id="rarities"></div>
      </section>

      <section class="eq-panel">
        <div class="eq-head"><h2>Bônus do conjunto</h2><button type="button" class="eq-btn" id="add-bonus">Adicionar bônus</button></div>
        <div id="bonuses"></div>
      </section>

      <div id="message" class="eq-message"></div>
      <button class="eq-btn primary" type="submit">Salvar equipamento</button>
    </form>
  </main>
</div>
<script type="module" src="./js/equipment-editor.js"></script>
</body></html>
